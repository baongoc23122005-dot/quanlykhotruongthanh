<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Hệ thống</title>
    <!-- Nhúng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
        body { 
            font-family: 'Inter', sans-serif;
            /* Thay ảnh nền tại đây. Nếu dùng ảnh online thì dán link web vào url() */
            background: url('/static/congty.jpg') no-repeat center center fixed;
            background-size: cover;
        }
</style>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">WMS LOGIN</h4>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label text-muted">Tài khoản</label>
                                <input type="text" name="username" class="form-control" required placeholder="Nhập tài khoản...">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted">Mật khẩu</label>
                                <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu...">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ĐĂNG NHẬP</button>
                        </form>
                        <div class="mt-3 text-center text-muted small">
                            Demo: congnhan1 (Worker) | quanly1 (Manager)<br>Pass: 123456
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
